plugins {
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// Determine build-mode: pass -Pheadless=true to build excluded/LWJGL-free JAR
def isHeadlessBuild = project.hasProperty('headless') && project.property('headless') == 'true'

dependencies {
    implementation 'org.apache.commons:commons-math3:3.6.1'

    if (!isHeadlessBuild) {
        // Include LWJGL and platform natives for headed (interactive) runs
        implementation platform("org.lwjgl:lwjgl-bom:3.3.3")
        implementation "org.lwjgl:lwjgl"
        implementation "org.lwjgl:lwjgl-glfw"
        implementation "org.lwjgl:lwjgl-opengl"

        // choose native classifier for the current build machine
        def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
        def osArch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
        def nativeClassifier

        if (osName.contains('mac')) {
            nativeClassifier = (osArch.contains('aarch64') || osArch.contains('arm64')) ? 'natives-macos-arm64' : 'natives-macos'
        } else if (osName.contains('linux')) {
            nativeClassifier = (osArch.contains('aarch64') || osArch.contains('arm64')) ? 'natives-linux-arm64' : 'natives-linux'
        } else if (osName.contains('win')) {
            nativeClassifier = 'natives-windows'
        } else {
            throw new GradleException("Unsupported OS: ${osName}/${osArch}")
        }

        runtimeOnly "org.lwjgl:lwjgl::${nativeClassifier}"
        runtimeOnly "org.lwjgl:lwjgl-glfw::${nativeClassifier}"
        runtimeOnly "org.lwjgl:lwjgl-opengl::${nativeClassifier}"
    }
}

application {
    mainClass = 'TumorRPT.Main'
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
            // For headless build, exclude the LWJGL-specific OpenGL window classes
            if (isHeadlessBuild) {
                exclude 'HAL/Gui/OpenGL*.java'
                exclude 'HAL/Gui/OpenGL*Window.java'
            }
        }
        // Ensure resources are included
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

shadowJar {
    archiveBaseName.set('tumor-rpt-sim')
    archiveClassifier.set('all')
    archiveVersion.set('0.1.0')
    mergeServiceFiles()
}

// Additional task for running parameter sweep (once ready)
task runSweep(type: JavaExec) {
    mainClass = 'TumorRPT.ParameterSweep'
    classpath = sourceSets.main.runtimeClasspath
}
